[package]
name = "witty-pass-check"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Witty's access check, run in OutLayer: does this account hold a Witty NFT or a live Rental Pass?"

[[bin]]
name = "witty-pass-check"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
strip = true
