<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<script>try{var t=localStorage.getItem("es-theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;if(t==="dark")document.querySelector('meta[name="theme-color"]').content="#0D0E12"}catch(e){}</script>
<title>Offline · EurekaScout</title>
<style>
:root{--ink:#0B0B0F;--teal:#36E2CC;--muted:#4A4E57}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;text-align:center}
main{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
img{width:96px;height:96px;border-radius:24px}
h1{margin:0;font-size:28px}
p{margin:0;font-size:16px;line-height:1.55;color:var(--muted)}
button{min-height:52px;padding:0 28px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
html[data-theme="dark"] body{background:#0D0E12;color:#ECEEF2}
html[data-theme="dark"] p{color:#A6ACB7}
html[data-theme="dark"] button{background:#ECEEF2;color:#0B0B0F}
</style>
</head>
<body>
<main>
  <img src="/img/icon-192.png" width="96" height="96" alt="">
  <h1>You're offline</h1>
  <p>Witty reads his record live from NEAR, so this needs a connection. Try again once you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
