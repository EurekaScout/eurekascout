[package]
name = "witty-trial-minter"
version = "1.0.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
description = "Free 7-day trial passes: the owner account mints them through the pass contract's mint_comp, from a key that can do nothing else"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
